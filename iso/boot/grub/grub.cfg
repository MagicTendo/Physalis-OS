set default=0
set timeout=15

insmod all_video
insmod vbe
insmod vga
insmod png

menuentry "Physalis OS VGA Mode" {
    echo "Launching Physalis OS..."
    set gfxmode=640x480x16
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin
    echo "Booting Physalis OS!"
    boot
}

menuentry "Physalis OS Text Mode" {
    echo "Launching Physalis OS..."
    set gfxpayload=text
    multiboot2 /boot/kernel.bin mode=text
    echo "Booting Physalis OS!"
    boot
}

menuentry "Escape" {
    reboot
}

menuentry "Go touch grass" {
    halt
}